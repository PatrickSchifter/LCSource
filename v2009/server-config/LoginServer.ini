[Server]
No=1
; @PUBLIC_IP@ is replaced by v2009/scripts/run-server.sh (LC_PUBLIC_IP, default 127.0.0.1)
IP=@PUBLIC_IP@
Port=4201
AllowExternalIP=TRUE
; Nation byte the client must send in MSG_LOGIN: the 2009 client on the BR2014 assets is BRAZIL (10).
; Omit to require the build's region (USA = 9).
Nation=10

[Messenger Server]
IP=127.0.0.1
Port=4200

[Connector Server]
Count=1
EX_IP=@PUBLIC_IP@

[Connector_0]
Number=1
MaxSubNumber=1
IP=127.0.0.1
Port=4206

[User DB]
IP=127.0.0.1
User=lcserver
Password=lcserver
DBName=lc2009_auth

[Auth DB]
IP=127.0.0.1
User=lcserver
Password=lcserver
DBName=lc2009_auth

[Data DB]
IP=127.0.0.1
User=lcserver
Password=lcserver
DBName=lc2009_data

[Block IP]
Number=0

[Block Band]
Number=0

; Failed-login throttling per IP (count >= MaxTry blocks; table reset every Refresh hours)
[Auto Block]
Refresh=1
MaxTry=1000
