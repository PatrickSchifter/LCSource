# The servers of the three versions on the remote host (deploy/linux/README.md). Host networking:
# each version has its own ports (40xx/41xx, 42xx, 43xx/44xx) and the servers talk on 127.0.0.1.
# /srv/lc/lc.env holds LC_PUBLIC_IP and the database (LC_DB_HOST, LC_DB_PORT, LC_DB_USER,
# LC_DB_PASSWORD); it is not in the repository.
x-server: &server
  image: lastchaos-servers
  network_mode: host
  restart: unless-stopped
  env_file: /srv/lc/lc.env
  stop_grace_period: 30s

services:
  v2009:
    <<: *server
    command: v2009
    volumes: [/srv/lc/v2009:/srv/lc/v2009]
  v2015:
    <<: *server
    command: v2015
    volumes: [/srv/lc/v2015:/srv/lc/v2015]
  v2018:
    <<: *server
    command: v2018
    volumes: [/srv/lc/v2018:/srv/lc/v2018]
